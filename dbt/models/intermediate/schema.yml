  - name: int_ufs
    description: "Estados brasileiros, EX (EXterior), NI (Não Informado)"        
    columns:
      - name: codigo
        description: "Código do uf."
        data_type: tinyint
        constraints:
          - type: not_null
        data_tests:
          - unique
          - not_null

      - name: sigla
        description: "Sigla da UF."
        data_type: string
        constraints:           
          - type: not_null        
          - type: check
            name: chk_sigla_uf
            expression: "sigla IN('NÃO INF.','NÃO IDENT.','AC','AP','AM','PA','RO','RR','TO','AL','BA','CE','MA','PB','PE','PI','RN','SE','DF','GO','MT','MS','ES','MG','RJ','SP','PR','RS','SC','EX')"

      - name: descricao
        description: "Descrição da uf."
        data_type: string
        constraints:
          - type: not_null      

      - name: regiao
        description: "Região para os estados do BRASIL."
        data_type: string
        constraints:
          - type: not_null
          - type: check
            name: chk_regiao
            expression: "regiao IN('NÃO INDENTIFICADO','NÃO INFORMADO','NORTE','NORDESTE','CENTRO-OESTE','SUDESTE','SUL','EXTERIOR')"

      - name: data_processamento
        description: "Data e hora do processamento dos dados."
        data_type: timestamp  
        constraints:
          - type: not_null